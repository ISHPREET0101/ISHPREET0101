fill="#64e5b1"/><text x="41" y="246" fill="#64e5b1" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="400" >Windows portable release</text><text x="451" y="246" fill="#cbd8f0" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" text-anchor="end">↗</text></svg><svg x="500" y="0" xmlns="http://www.w3.org/2000/svg" width="480" height="272" viewBox="0 0 480 272" role="img" aria-labelledby="title desc">
<title id="title">CircuitSleuth — COMPUTER VISION / TEAM PROJECT</title><desc id="desc">Inspect the board. Question the evidence. Adaptive PCB inspection with human review. Workflow: Align boards → Verify regions → Evidence verdict. Collaborative project. Published benchmark uses seeded synthetic boards; it is not factory accuracy.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101d35"/><stop offset="1" stop-color="#090f1e"/></linearGradient><linearGradient id="accent"><stop stop-color="#64e5b1"/><stop offset="0.55" stop-color="#70cfff"/><stop offset="1" stop-color="#c2a7ff"/></linearGradient><pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M 36 0 L 0 0 0 36" fill="none" stroke="#ffffff" stroke-opacity=".035"/></pattern></defs>
