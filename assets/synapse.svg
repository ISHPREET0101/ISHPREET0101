<title id="title">Synapse Memory Lab — ML / INTERACTIVE EXPLAINER</title><desc id="desc">Make attention and memory visible. Explore recurrence, decay and interference. Workflow: Token stream → Memory update → Read + compare. Collaborative educational toy simulations; no official BDH checkpoint or trained-model benchmark is run.</desc>
