<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1040" viewBox="0 0 360 1040" role="img" aria-labelledby="title desc">
<title id="title">Six conceptual project workflows, with numbered stages</title><desc id="desc">Six conceptual project workflows, with numbered stages</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101d35"/><stop offset="1" stop-color="#090f1e"/></linearGradient><linearGradient id="accent"><stop stop-color="#64e5b1"/><stop offset="0.55" stop-color="#70cfff"/><stop offset="1" stop-color="#c2a7ff"/></linearGradient><pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M 36 0 L 0 0 0 36" fill="none" stroke="#ffffff" stroke-opacity=".035"/></pattern></defs>
<rect width="360" height="1040" rx="16" fill="url(#bg)"/><text x="20" y="31" fill="#70cfff" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="600" letter-spacing="1.5">FROM INPUT TO OUTCOME</text><text x="20" y="64" fill="#64e5b1" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" >BlockIT</text><rect x="20" y="79" width="150" height="38" rx="7" fill="#152239" stroke="#364b6c"/><text x="95" y="103" fill="#e3ebfb" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="500" text-anchor="middle">1. Choose a drive</text><rect x="190" y="79" width="150" height="38" rx="7" fill="#152239" stroke="#364b6c"/><text x="265" y="103" fill="#e3ebfb" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="500" text-anchor="middle">2. Scan metadata</text><rect x="20" y="132" width="150" height="38" rx="7" fill="#152239" stroke="#364b6c"/><text x="95" y="156" fill="#e3ebfb" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="500" text-anchor="middle">3. SQLite + workers</text><rect x="190" y="132" width="150" height="38" rx="7" fill="#152239" stroke="#364b6c"/><text x="265" y="156" fill="#e3ebfb" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="500" text-anchor="middle">4. Explore + search</text><text x="20" y="221" fill="#70cfff" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" >CircuitSleuth</text><rect x="20" y="236" width="150" height="38" rx="7" fill="#152239" stroke="#364b6c"/><text x="95" y="260" fill="#e3ebfb" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="500" text-anchor="middle">1. Board + reference</text><rect x="190" y="236" width="150" height="38" rx="7" fill="#152239" stroke="#364b6c"/><text x="265" y="260" fill="#e3ebfb" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="500" text-anchor="middle">2. Align + detect</text><rect x="20" y="289" width="150" height="38" rx="7" fill="#152239" stroke="#364b6c"/><text x="95" y="313" fill="#e3ebfb" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="500" text-anchor="middle">3. Select next tool</text><rect x="190" y="289" width="150" height="38" rx="7" fill="#152239" stroke="#364b6c"/><text x="265" y="313" fill="#e3ebfb" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="500" text-anchor="middle">4. Verdict / review</text><text x="20" y="378" fill="#ff9a8b" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" >Takumi</text><rect x="20" y="393" width="150" height="38" rx="7" fill="#152239" stroke="#364b6c"/><text x="95" y="417" fill="#e3ebfb" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="500" text-anchor="middle">1. Record a task</text><rect x="190" y="393" width="150" height="38" rx="7" fill="#152239" stroke="#364b6c"/><text x="265" y="417" fill="#e3ebfb" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="500" text-anchor="middle">2. Transcribe + draft</text><rect x="20" y="446" width="150" height="38" rx="7" fill="#152239" stroke="#364b6c"/><text x="95" y="470" fill="#e3ebfb" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="500" text-anchor="middle">3. Expert approves</text><rect x="190" y="446" width="150" height="38" rx="7" fill="#152239" stroke="#364b6c"/><text x="265" y="470" fill="#e3ebfb" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="500" text-anchor="middle">4. Guided practice</text><text x="20" y="535" fill="#c2a7ff" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" >OpenDoor</text><rect x="20" y="550" width="150" height="38" rx="7" fill="#152239" stroke="#364b6c"/><text x="95" y="574" fill="#e3ebfb" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="500" text-anchor="middle">1. Bounded purpose</text><rect x="190" y="550" width="150" height="38" rx="7" fill="#152239" stroke="#364b6c"/><text x="265" y="574" fill="#e3ebfb" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="500" text-anchor="middle">2. Evidence + facts</text><rect x="20" y="603" width="150" height="38" rx="7" fill="#152239" stroke="#364b6c"/><text x="95" y="627" fill="#e3ebfb" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="500" text-anchor="middle">3. Human decisions</text><rect x="190" y="603" width="150" height="38" rx="7" fill="#152239" stroke="#364b6c"/><text x="265" y="627" fill="#e3ebfb" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="500" text-anchor="middle">4. Publish revision</text><text x="20" y="692" fill="#f3cf75" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" >Synapse Memory Lab</text><rect x="20" y="707" width="150" height="38" rx="7" fill="#152239" stroke="#364b6c"/><text x="95" y="731" fill="#e3ebfb" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="500" text-anchor="middle">1. Seeded tokens</text><rect x="190" y="707" width="150" height="38" rx="7" fill="#152239" stroke="#364b6c"/><text x="265" y="731" fill="#e3ebfb" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="500" text-anchor="middle">2. Outer-product write</text><rect x="20" y="760" width="150" height="38" rx="7" fill="#152239" stroke="#364b6c"/><text x="95" y="784" fill="#e3ebfb" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="500" text-anchor="middle">3. Query fixed state</text><rect x="190" y="760" width="150" height="38" rx="7" fill="#152239" stroke="#364b6c"/><text x="265" y="784" fill="#e3ebfb" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="500" text-anchor="middle">4. Observe interference</text><text x="20" y="849" fill="#82aaff" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" >RetailPulse AI</text><rect x="20" y="864" width="150" height="38" rx="7" fill="#152239" stroke="#364b6c"/><text x="95" y="888" fill="#e3ebfb" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="500" text-anchor="middle">1. Validate tables</text><rect x="190" y="864" width="150" height="38" rx="7" fill="#152239" stroke="#364b6c"/><text x="265" y="888" fill="#e3ebfb" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="500" text-anchor="middle">2. RFM + behavior</text><rect x="20" y="917" width="150" height="38" rx="7" fill="#152239" stroke="#364b6c"/><text x="95" y="941" fill="#e3ebfb" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="500" text-anchor="middle">3. Compare clusters</text><rect x="190" y="917" width="150" height="38" rx="7" fill="#152239" stroke="#364b6c"/><text x="265" y="941" fill="#e3ebfb" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="500" text-anchor="middle">4. Profiles + classifier</text><text x="20" y="1021" fill="#aabbda" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="400" >Conceptual flows. See repository docs for details.</text></svg>