<title id="title">OpenDoor — FULL STACK / HUMAN REVIEW</title><desc id="desc">Better directories start with evidence. Review every change before publication. Workflow: Candidate facts → Field decisions → Audited revision. The demonstrated review flow uses simulated calls. Live CALL-E creation is not a validated end-to-end integration.</desc>
