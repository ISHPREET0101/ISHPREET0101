<title id="title">Takumi — APPLIED AI / EXPERT KNOWLEDGE</title><desc id="desc">Turn demonstrations into guided practice. Capture the reasoning behind expert work. Workflow: Demonstration → Expert review → Guided practice. Hosted browser demo uses a bundled sample. Custom uploads and AI processing require the local backend.</desc>
