<rect x="1" y="1" width="358" height="282" rx="16" fill="url(#bg)" stroke="#30415d"/><text x="20" y="28" fill="#ff9a8b" font-family="Segoe UI,Arial,sans-serif" font-size="8.5" font-weight="600" letter-spacing="1">APPLIED AI / EXPERT KNOWLEDGE</text><text x="20" y="65" fill="#f3f6ff" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" >Takumi</text><text x="20" y="96" fill="#c3cfe4" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" >Turn demonstrations into guided</text><text x="20" y="116" fill="#c3cfe4" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" >practice. Capture the reasoning behind</text><text x="20" y="136" fill="#c3cfe4" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" >expert work.</text><text x="20" y="166" fill="#aabbda" font-family="Segoe UI,Arial,sans-serif" font-size="10.5" font-weight="400" >React · FastAPI · Whisper · SQLite</text><circle cx="25" cy="190" r="2.5" fill="#ff9a8b"/><text x="36" y="194" fill="#dbe7fb" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" >Demonstration</text><circle cx="25" cy="211" r="2.5" fill="#ff9a8b"/><text x="36" y="215" fill="#dbe7fb" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" >Expert review</text><circle cx="25" cy="232" r="2.5" fill="#ff9a8b"/><text x="36" y="236" fill="#dbe7fb" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" >Guided practice</text><text x="20" y="263" fill="#ff9a8b" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="400" >Sample demo + local processing</text><text x="337" y="263" fill="#dbe7fb" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="end">↗</text><rect x="1" y="297" width="358" height="282" rx="16" fill="url(#bg)" stroke="#30415d"/><text x="20" y="324" fill="#c2a7ff" font-family="Segoe UI,Arial,sans-serif" font-size="8.5" font-weight="600" letter-spacing="1">MULTIPLAYER / VIRTUAL OFFICE</text><text x="20" y="361" fill="#f3f6ff" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" >2D Metaverse</text><text x="20" y="392" fill="#c3cfe4" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" >Meet teammates in a shared world. Walk</text><text x="20" y="412" fill="#c3cfe4" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" >nearby to start a video call.</text><text x="20" y="462" fill="#aabbda" font-family="Segoe UI,Arial,sans-serif" font-size="10.5" font-weight="400" >Browser avatars · Shared world · Proximity video</text><circle cx="25" cy="486" r="2.5" fill="#c2a7ff"/><text x="36" y="490" fill="#dbe7fb" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" >Choose avatar</text><circle cx="25" cy="507" r="2.5" fill="#c2a7ff"/><text x="36" y="511" fill="#dbe7fb" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" >Explore</text><circle cx="25" cy="528" r="2.5" fill="#c2a7ff"/><text x="36" y="532" fill="#dbe7fb" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" >Meet nearby</text><text x="20" y="559" fill="#c2a7ff" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="400" >Explore the public demo</text><text x="337" y="559" fill="#dbe7fb" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="end">↗</text></svg>